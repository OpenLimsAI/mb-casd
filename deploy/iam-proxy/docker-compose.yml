# iam-proxy —— 服务端 OIDC 调用的「同名 TLS 代理」（ADR-0003）。
#
# 部署机访问不了公网 https://iam.openlims.ai（中国移动 → Cloudflare 不稳定），
# 但 OIDC 的 discovery / 换 token / 拉 JWKS 都是上层应用服务端发起的。
# 加入 `iam-oidc` 网络的应用把 iam.openlims.ai 解析到本代理：代理用自建 CA
# 给该域名签证书，只放行少数服务端 OIDC 路径，经 mb-pm-v2_internal 转发到 casdoor:8000。
#
# 信任：应用只读挂载 ./ca/root.crt（公开根证书；CA 私钥留在 caddy-data 卷里，绝不挂给应用）。
# Node 用 NODE_EXTRA_CA_CERTS；Go 的 SSL_CERT_FILE 是替换不是追加，需给「系统根证书 + 本 CA」合并文件。
# 红线：别名只放在 iam-oidc 上 —— 放到共享网络会劫持同网所有容器对 iam.openlims.ai 的访问。
name: iam-proxy

services:
  iam-proxy:
    image: caddy:2.11.3-alpine
    container_name: iam-proxy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      mbpm_internal: {}
      oidc:
        aliases:
          - iam.openlims.ai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Casdoor 所在网络（mb-pm-v2 栈创建）；mb-pm-v2 重建网络后需 `docker compose up -d --force-recreate` 重连。
  mbpm_internal:
    external: true
    name: mb-pm-v2_internal
  oidc:
    name: iam-oidc
    # 无出网网关：成员各自的出网走自己的其他网络，这张网只承载 IdP 调用。
    internal: true

volumes:
  caddy-data:
  caddy-config:
